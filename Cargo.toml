[package]
name = "taw-analyser"
version = "0.1.0"
edition = "2021"
description = "Timster's Audio Works Analyser (SP-001): a stand-alone spectrum analyser for Windows (WASAPI) and Linux (PipeWire)"
authors = ["Timster's Audio Works"]
publish = false

[dependencies]
# Unreleased (0.3.0 to be): the hifi look, with the spectrum drawing and the analyser
taw-panel = { git = "https://github.com/TimsterAudio/TAW-Panel", rev = "ce561c2f843f7b7e093958975c48837f95b530db", features = ["analyser"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_53"] }
cpal = { version = "0.18", features = ["pipewire"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
